name: CodeQL

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "41 3 * * 3"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: windows-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: c-cpp
            build-mode: manual
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages (packages.config)
        run: |
          nuget restore FoCAPI.sln -PackagesDirectory D:\a\nuget-packages -NonInteractive
        shell: cmd

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended, security-and-quality
          # packages/ is the NuGet restore target (packages.config) holding
          # vendored third-party libraries (minhook). Not repository code.
          config: |
            paths-ignore:
              - packages

      - name: Build
        run: msbuild FoCAPI.sln /m /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:MinHookRoot=D:\a\nuget-packages\minhook.1.3.3
        shell: cmd

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
